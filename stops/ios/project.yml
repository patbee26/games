# XcodeGen spec: the reliable way to get a project file on a Mac.
#
#   brew install xcodegen && cd ios && xcodegen
#
# Kept because the checked-in OffAuto.xcodeproj was written on a machine with
# no Xcode on it and could not be opened to check. This file is a
# specification rather than a serialised object graph, so if the two ever
# disagree, this one is the one to believe.
name: OffAuto
options:
  bundleIdPrefix: com.offauto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  OffAutoKit:
    path: OffAutoKit

targets:
  OffAuto:
    type: application
    platform: iOS
    sources:
      - path: OffAuto
    dependencies:
      - package: OffAutoKit
        product: OffAutoKit
    info:
      path: OffAuto/Info.plist
      properties:
        CFBundleDisplayName: Off Auto
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.offauto.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
