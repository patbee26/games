# Drag this folder onto Netlify, or point a site at it. There is no build step.
[build]
  publish = "."
  command = ""

# The service worker must never be served stale, or a deploy can never reach a
# phone that already has the app installed.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Fingerprinted-in-practice assets: the service worker owns their lifetime.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
